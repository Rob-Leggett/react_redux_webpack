name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'wiki/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'wiki/**']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (api + client)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json

      - name: Install, type check, lint, test and build
        run: |
          for pkg in api client; do
            echo "::group::$pkg"
            (cd "$pkg" && npm ci && npm run type-check && npm run lint && npm test && npm run build)
            echo "::endgroup::"
          done
